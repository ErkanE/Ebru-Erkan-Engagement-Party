<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebru &amp; Erkan · Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hurricane&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2ea;
    --card: #fffdf9;
    --ink: #1d2433;
    --muted: #6b6f78;
    --line: #e7dfd2;
    --navy: #1f3a68;
    --accent: #c8582b;
    --accent-ink: #ffffff;
    --ok: #2f7d55;
    --bad: #b3261e;
    --radius: 18px;
    --shadow: 0 18px 50px -20px rgba(29, 36, 51, .35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  } 
  button, input { font: inherit; color: inherit; }

  /* Hero */
  .hero { position: relative; height: min(64vh, 600px); min-height: 380px; overflow: hidden; background: var(--navy); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 38% 40%; }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,16,30,.35) 0%, rgba(10,16,30,0) 30%, rgba(10,16,30,.15) 55%, rgba(10,16,30,.75) 100%);
  }
  .hero-text { position: absolute; left: 0; right: 0; bottom: 84px; z-index: 1; text-align: center; color: #fff; padding: 0 16px; }
  .eyebrow { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; font-weight: 500; opacity: .92; }
  .names { font-family: "Hurricane", cursive, Georgia, serif; font-weight: 400; font-size: clamp(48px, 13vw, 84px); line-height: 1; margin: 8px 0 6px; letter-spacing: .01em; text-shadow: 0 2px 24px rgba(0,0,0,.3); }
  .names .amp { font-style: normal; color: #f3c9a8; padding: 0 .08em; }
  .date { font-size: 15px; letter-spacing: .12em; opacity: .95; }
  .lang { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 2; display: flex; background: rgba(255,255,255,.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: transparent; color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .06em; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--ink); }

  /* Card */
  main { position: relative; z-index: 2; max-width: 560px; margin: -60px auto 0; padding: 0 16px 40px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 22px 24px; }
  h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; margin: 0 0 8px; text-align: center; color: var(--navy); }
  .intro { margin: 0 auto 22px; color: var(--muted); text-align: center; max-width: 40ch; }
  label.field { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .input { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 13px 14px; font-size: 16px; outline: none; transition: border-color .15s; }
  .input:focus { border-color: var(--navy); }
  .stack > * + * { margin-top: 16px; }

  .pick {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    background: linear-gradient(135deg, #f6e9cf 0%, #e6cf9f 45%, #d4b47a 100%); color: #3d3020;
    border: 1px solid #c9a96b; border-radius: 14px; padding: 17px 18px;
    font-size: 17px; font-weight: 600; letter-spacing: .01em; cursor: pointer;
    box-shadow: 0 10px 24px -12px rgba(160, 122, 60, .75), inset 0 1px 0 rgba(255, 255, 255, .6);
    transition: transform .1s, filter .15s;
  }
  .pick:hover { filter: brightness(1.05); }
  .pick:active { transform: scale(.985); }
  .pick:focus-within { outline: 3px solid rgba(31,58,104,.35); outline-offset: 3px; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .pick svg { width: 22px; height: 22px; flex: none; }
  .pick.secondary { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); box-shadow: none; padding: 13px; font-size: 16px; }
  .hint { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--muted); margin: 12px 2px 0; }
  .hint svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
  .error { color: var(--bad); font-size: 14px; margin-top: 8px; }
  .btn { border: 0; background: var(--navy); color: #fff; border-radius: 12px; padding: 13px 18px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; }

  /* Progress */
  .summary { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .summary-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 8px; gap: 12px; }
  .summary-row strong { font-weight: 600; }
  .bar { height: 8px; border-radius: 99px; background: #efe8dc; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
  .bar.ok > i { background: var(--ok); }
  .notice { font-size: 13.5px; color: var(--accent); margin-top: 8px; }

  .list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; background: #efe8dc center/cover no-repeat; display: grid; place-items: center; color: var(--navy); overflow: hidden; }
  .thumb svg { width: 22px; height: 22px; opacity: .7; }
  .meta { min-width: 0; }
  .fname { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fsub { font-size: 12.5px; color: var(--muted); margin: 1px 0 5px; }
  .item .bar { height: 5px; }
  .state { width: 28px; height: 28px; display: grid; place-items: center; }
  .state svg { width: 22px; height: 22px; }
  .item.done .state { color: var(--ok); }
  .item.failed .state { color: var(--bad); }
  .item.failed .fsub { color: var(--bad); }
  .retry { border: 0; background: none; color: var(--navy); font-weight: 600; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; margin-left: 6px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .thanks { text-align: center; padding: 8px 0 4px; }
  .thanks .heart { width: 46px; height: 46px; color: var(--accent); margin: 0 auto 6px; display: block; }
  .thanks h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; font-weight: 600; color: var(--navy); margin: 0 0 4px; }
  .thanks p { margin: 0 0 16px; color: var(--muted); }

  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 22px 16px 34px; max-width: 460px; margin: 0 auto; }
  footer svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
  [hidden] { display: none !important; }

  @media (min-width: 720px) {
    .hero { height: 70vh; max-height: 720px; }
    .card { padding: 36px 40px 32px; }
    h2 { font-size: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
          <span data-t="pick"></span>
          <input type="file" id="files" multiple accept="image/*,video/*">
        </label>
        <p class="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.01" stroke-linecap="round"/></svg>
          <span data-t="hint"></span>
        </p>
      </div>
    </div>

    <div id="progress" class="summary" hidden>
      <div id="thanks" class="thanks" hidden>
        <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
        <h3 data-t="thanksTitle"></h3>
        <p id="thanksText"></p>
      </div>
      <div class="summary-row"><strong id="summaryText"></strong><span id="summaryPct"></span></div>
      <div class="bar" id="totalBar"><i></i></div>
      <div class="notice" id="notice" hidden></div>
      <ul class="list" id="list"></ul>
    </div>
  </section>
</main>

<footer>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  <span data-t="footer"></span>
</footer>

<script>
/* ======================= Settings you can change ======================= */
const EVENT_DATE = '05.12.2026';     // e.g. '14.06.2027' — leave '' to hide the date line
const API_URL = 'https://script.google.com/macros/s/AKfycbzCAAdhRqkG-16cjg0MjyPWTLjOTq7PgyBb55BravBgeE5XVQbEcYhIVZAsjg85uqQy/exec';        // only when hosting this page outside Apps Script: your /exec URL
/* ======================================================================= */
const EXEC_URL = '__EXEC_URL__';   // filled in automatically by Code.gs

const CHUNK = 4 * 1024 * 1024;   // 4 MiB, must be a multiple of 256 KiB
const PARALLEL = 3;              // files uploaded at the same time

const T = {
  tr: {
    eyebrow: 'Nişanımıza hoş geldiniz',
    heading: 'Anılarınızı bizimle paylaşın',
    intro: 'Bugün çektiğiniz fotoğraf ve videoları buraya yükleyin. Hepsi orijinal kalitesinde doğrudan bize ulaşır.',
    nameLabel: 'Adınız (isteğe bağlı)', namePh: 'ör. Ayşe & Mehmet',
    pick: 'Fotoğraf ve video seç', pickMore: 'Daha fazla ekle',
    hint: 'Yükleme bitene kadar bu sayfayı açık tutun.',
    codeLabel: 'Etkinlik kodu', continue: 'Devam', badCode: 'Bu kod doğru değil, tekrar dener misiniz?',
    waiting: 'Sırada', uploading: 'Yükleniyor', done: 'Yüklendi', failed: 'Yüklenemedi', retry: 'Tekrar dene',
    tooLarge: 'Dosya çok büyük', notMedia: 'Fotoğraf veya video değil', empty: 'Dosya boş',
    summary: (d, t) => `${d} / ${t} dosya yüklendi`,
    failedCount: n => `${n} dosya yüklenemedi`,
    reconnecting: 'Bağlantı koptu, tekrar deneniyor…',
    thanksTitle: 'Çok teşekkür ederiz!',
    thanksText: n => `${n} dosya bize ulaştı. Daha fazlasını da ekleyebilirsiniz.`,
    leave: 'Yükleme devam ediyor. Sayfadan çıkarsanız yarıda kalır.',
    footer: 'Dosyalar doğrudan Ebru ve Erkan’nun Google Drive’ına kaydedilir. Başka kimse göremez.',
  },
  en: {
    eyebrow: 'Welcome to our engagement party',
    heading: 'Share your memories with us',
    intro: 'Upload the photos and videos you took today. They come straight to us in full original quality.',
    nameLabel: 'Your name (optional)', namePh: 'e.g. Ebru & Erkan',
    pick: 'Choose photos & videos', pickMore: 'Add more',
    hint: 'Keep this page open until the upload finishes.',
    codeLabel: 'Event code', continue: 'Continue', badCode: 'That code isn’t right. Could you try again?',
    waiting: 'Waiting', uploading: 'Uploading', done: 'Uploaded', failed: 'Failed', retry: 'Try again',
    tooLarge: 'File too large', notMedia: 'Not a photo or video', empty: 'Empty file',
    summary: (d, t) => `${d} of ${t} files uploaded`,
    failedCount: n => `${n} ${n === 1 ? 'file' : 'files'} failed`,
    reconnecting: 'Connection dropped, retrying…',
    thanksTitle: 'Thank you so much!',
    thanksText: n => `${n} ${n === 1 ? 'file' : 'files'} reached us. Feel free to add more.`,
    leave: 'Uploads are still running. Leaving now will stop them.',
    footer: 'Files are saved straight to Ebru & Erkan’s Google Drive. No one else can see them.',
  },
};

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem('ee.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('ee.' + k, v); } catch (e) {} },
};

/* ---------- Language ---------- */
let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en');
function t(key, ...a) { const v = T[lang][key]; return typeof v === 'function' ? v(...a) : v; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  if (items.length) { $('pick').querySelector('span').textContent = t('pickMore'); render(); }
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; store.set('lang', lang); applyLang(); }));
if (EVENT_DATE) { $('date').textContent = EVENT_DATE; $('date').hidden = false; }

/* ---------- Backend transport ---------- */
// Uploads go straight to the /exec URL over HTTP. This works no matter which Google accounts the
// guest is signed in to. google.script.run is only a fallback, because it fails for people signed
// in to several Google accounts.
const inAppsScript = !!(window.google && google.script && google.script.run);
let httpUrl = API_URL || (EXEC_URL.indexOf('__') === 0 ? '' : EXEC_URL);
let httpWorks = false;

function gasCall(action, payload) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload));
}
async function httpCall(action, payload) {
  let r, j;
  try {
    r = await fetch(httpUrl, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
  } catch (e) { const x = new Error('NETWORK: ' + e.message); x.transport = true; throw x; }
  try { j = await r.json(); } catch (e) {
    const x = new Error('NETWORK: unexpected reply (HTTP ' + r.status + ')'); x.transport = true; throw x;
  }
  if (!j.ok) throw new Error(j.error);
  return j.result;
}
async function call(action, payload) {
  if (httpUrl) {
    try { const res = await httpCall(action, payload); httpWorks = true; return res; }
    catch (e) {
      if (e.transport && !httpWorks && inAppsScript) {
        console.warn('Direct upload link not reachable, switching to google.script.run:', e.message);
        httpUrl = '';
      } else throw e;
    }
  }
  if (inAppsScript) return gasCall(action, payload);
  return mockCall(action, payload);
}
const errMsg = e => String((e && e.message) || e || '').replace(/^(Script)?Error:\s*/i, '').trim();
const errCode = e => {
  const m = errMsg(e);
  return ['BAD_CODE', 'TOO_LARGE', 'NOT_MEDIA', 'SESSION_EXPIRED'].find(c => m.includes(c)) || null;
};
// Errors worth retrying many times (network or temporary Google errors). Anything else is retried
// twice and then shown to the guest, so a real problem is never hidden behind "retrying…".
const TRANSIENT = /NETWORK|NetworkError|HTTP 0|Failed to fetch|Load failed|timed? ?out|server error occurred|try again|RETRY:|too many times|Rate Limit|Exceeded maximum|unavailable|Internal error/i;
const maxTries = e => TRANSIENT.test(errMsg(e)) ? 8 : 2;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Event code ---------- */
let eventCode = '';
function readUrlCode() {
  return new Promise(resolve => {
    if (inAppsScript && google.script.url) google.script.url.getLocation(l => resolve((l.parameter && l.parameter.code) || ''));
    else resolve(new URLSearchParams(location.search).get('code') || '');
  });
}
async function init() {
  applyLang();
  $('guest').value = store.get('guest') || '';
  let cfg = { codeRequired: false };
  try { cfg = await call('config', {}); } catch (e) {}
  eventCode = (await readUrlCode()) || store.get('code') || '';
  if (cfg.codeRequired) {
    let ok = false;
    if (eventCode) { try { await call('check', { code: eventCode }); ok = true; } catch (e) {} }
    if (!ok) { $('codeStep').hidden = false; $('code').focus(); return; }
    store.set('code', eventCode);
  }
  $('uploadStep').hidden = false;
}
$('codeStep').addEventListener('submit', async ev => {
  ev.preventDefault();
  const code = $('code').value.trim();
  if (!code) return;
  $('codeError').hidden = true;
  try {
    await call('check', { code });
    eventCode = code; store.set('code', code);
    $('codeStep').hidden = true; $('uploadStep').hidden = false;
  } catch (e) { $('codeError').hidden = false; }
});

/* ---------- Upload queue ---------- */
const items = [];
let active = 0, reconnecting = 0, wakeLock = null;

$('guest').addEventListener('change', () => store.set('guest', $('guest').value.trim()));
$('files').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  for (const file of files) {
    const it = { id: Math.random().toString(36).slice(2), file, sent: 0, state: 'waiting', error: '' };
    if (!file.size) { it.state = 'failed'; it.error = 'empty'; it.final = true; }
    items.push(it);
  }
  $('progress').hidden = false;
  $('pick').querySelector('span').textContent = t('pickMore');
  render();
  pump();
});

function pump() {
  while (active < PARALLEL) {
    const next = items.find(i => i.state === 'waiting');
    if (!next) break;
    active++;
    next.state = 'uploading';
    upload(next).then(() => { next.state = 'done'; next.sent = next.file.size; })
      .catch(err => {
        next.state = 'failed';
        const c = errCode(err);
        next.error = c === 'TOO_LARGE' ? 'tooLarge' : c === 'NOT_MEDIA' ? 'notMedia' : '';
        next.detail = next.error ? '' : errMsg(err).replace(/^(NETWORK|RETRY):\s*/, '').slice(0, 160);
        next.final = !!next.error;
        console.error(next.file.name, err);
      })
      .finally(() => { active--; render(); pump(); });
  }
  const busy = active > 0;
  if (busy) keepAwake(); else releaseAwake();
  render();
}

async function upload(it) {
  const f = it.file;
  const start = () => withRetry(() => call('start', {
    name: f.name, type: f.type, size: f.size, guest: $('guest').value.trim(), code: eventCode,
  }));
  let { url } = await start();
  let offset = 0, fails = 0;
  it.sent = 0; render();
  while (true) {
    try {
      const data = await toBase64(f.slice(offset, Math.min(offset + CHUNK, f.size)));
      const r = await call('chunk', { url, start: offset, total: f.size, data });
      fails = 0; setReconnecting(false);
      if (r.done) return;
      offset = r.next;
    } catch (err) {
      const c = errCode(err);
      if (c === 'SESSION_EXPIRED') { ({ url } = await start()); offset = 0; continue; }
      if (c) throw err;
      if (++fails >= maxTries(err)) throw err;
      setReconnecting(true, err);
      await sleep(Math.min(30000, 1000 * 2 ** fails));
      try {
        const s = await call('status', { url, total: f.size });   // ask Drive where we are
        if (s.done) return;
        offset = s.next;
      } catch (e2) {
        if (errCode(e2) === 'SESSION_EXPIRED') { ({ url } = await start()); offset = 0; }
      }
    }
    it.sent = offset; render();
  }
}

async function withRetry(fn, tries = 5) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) { if (errCode(e) || i >= Math.min(tries, maxTries(e)) - 1) throw e; setReconnecting(true, e); await sleep(1000 * 2 ** i); }
  }
}
let lastError = '';
function setReconnecting(on, err) {
  reconnecting = on ? reconnecting + 1 : 0;
  if (err) { lastError = errMsg(err).replace(/^(NETWORK|RETRY):\s*/, '').slice(0, 120); console.warn('Upload problem:', errMsg(err)); }
  renderNotice();
}

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).slice(String(r.result).indexOf(',') + 1));
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

/* ---------- Keep the phone awake while uploading ---------- */
async function keepAwake() {
  if (wakeLock || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
}
function releaseAwake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && active) keepAwake(); });
window.addEventListener('beforeunload', e => { if (active || items.some(i => i.state === 'waiting')) { e.preventDefault(); e.returnValue = t('leave'); return t('leave'); } });

/* ---------- Rendering ---------- */
const ICON = {
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>',
  failed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.01"/></svg>',
  uploading: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6" opacity=".9"/></svg>',
  waiting: '<svg viewBox="0 0 24 24" fill="none" stroke="#b9b2a6" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
};
const fmtSize = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; draw(); });
}
function draw() {
  const list = $('list');
  for (const it of items) {
    let li = list.querySelector(`[data-id="${it.id}"]`);
    if (!li) {
      li = document.createElement('li');
      li.className = 'item'; li.dataset.id = it.id;
      const isVideo = (it.file.type || '').startsWith('video/') || /\.(mov|mp4|m4v|3gp|avi|mkv)$/i.test(it.file.name);
      li.innerHTML = `<div class="thumb">${isVideo ? ICON.video : ICON.photo}</div>
        <div class="meta"><div class="fname">${esc(it.file.name)}</div><div class="fsub"></div><div class="bar"><i></i></div></div>
        <div class="state"></div>`;
      if (!isVideo && /^image\/(jpeg|png|gif|webp)$/.test(it.file.type)) {
        const url = URL.createObjectURL(it.file);
        const img = new Image();
        img.onload = () => { li.querySelector('.thumb').style.backgroundImage = `url("${url}")`; li.querySelector('.thumb').innerHTML = ''; };
        img.src = url;
      }
      list.prepend(li);
    }
    if (li.dataset.state === it.state && it.state !== 'uploading' && li.dataset.lang === lang) continue;
    li.dataset.state = it.state; li.dataset.lang = lang;
    li.className = 'item ' + it.state;
    const pct = it.file.size ? Math.round(100 * it.sent / it.file.size) : 0;
    const sub = li.querySelector('.fsub');
    if (it.state === 'uploading') sub.textContent = `${t('uploading')} · ${pct}% · ${fmtSize(it.file.size)}`;
    else if (it.state === 'failed') {
      sub.innerHTML = esc(it.error ? t(it.error) : t('failed') + (it.detail ? ': ' + it.detail : '')) + (it.final ? '' : ` <button class="retry" type="button">${esc(t('retry'))}</button>`);
      const rb = sub.querySelector('.retry');
      if (rb) rb.onclick = () => { it.state = 'waiting'; it.sent = 0; pump(); };
    } else sub.textContent = `${t(it.state)} · ${fmtSize(it.file.size)}`;
    li.querySelector('.bar > i').style.width = (it.state === 'done' ? 100 : pct) + '%';
    li.querySelector('.bar').classList.toggle('ok', it.state === 'done');
    li.querySelector('.state').innerHTML = ICON[it.state];
  }

  const total = items.reduce((s, i) => s + i.file.size, 0) || 1;
  const sent = items.reduce((s, i) => s + (i.state === 'done' ? i.file.size : i.sent), 0);
  const done = items.filter(i => i.state === 'done').length;
  const failed = items.filter(i => i.state === 'failed').length;
  const finished = items.length && !items.some(i => i.state === 'waiting' || i.state === 'uploading');
  $('summaryText').textContent = t('summary', done, items.length) + (failed ? ' · ' + t('failedCount', failed) : '');
  $('summaryPct').textContent = Math.round(100 * sent / total) + '%';
  $('totalBar').firstElementChild.style.width = (100 * sent / total) + '%';
  $('totalBar').classList.toggle('ok', finished && !failed);
  $('thanks').hidden = !(finished && done > 0);
  $('thanksText').textContent = t('thanksText', done);
  renderNotice();
}
function renderNotice() {
  const show = reconnecting > 0 && active > 0;
  $('notice').hidden = !show;
  if (show) $('notice').textContent = t('reconnecting') + (lastError ? ' (' + lastError + ')' : '');
}

/* ---------- Demo backend (used only when opened outside Apps Script with no API_URL) ---------- */
const mock = { sessions: {} };
async function mockCall(action, p) {
  await sleep(150 + Math.random() * 350);
  const needCode = new URLSearchParams(location.search).has('democode');
  const badCode = () => { if (needCode && String(p.code || '').toUpperCase() !== 'EE2027') throw new Error('BAD_CODE'); };
  switch (action) {
    case 'config': return { codeRequired: needCode };
    case 'check': badCode(); return { ok: true };
    case 'start': {
      badCode();
      if (p.size > 4096 * 1024 * 1024) throw new Error('TOO_LARGE');
      const url = 'mock://' + Math.random().toString(36).slice(2);
      mock.sessions[url] = { got: 0, total: p.size };
      return { url };
    }
    case 'chunk': {
      const s = mock.sessions[p.url];
      if (Math.random() < 0.08) throw new Error('Network error (simulated, before saving)');
      if (p.start !== s.got) throw new Error('Out of order chunk: ' + p.start + ' vs ' + s.got);
      s.got += Math.floor(p.data.length * 3 / 4) - (p.data.endsWith('==') ? 2 : p.data.endsWith('=') ? 1 : 0);
      if (Math.random() < 0.05) throw new Error('Network error (simulated, after saving)');
      return s.got >= s.total ? { done: true, next: null } : { done: false, next: s.got };
    }
    case 'status': {
      const s = mock.sessions[p.url];
      return s.got >= s.total ? { done: true, next: null } : { done: false, next: s.got };
    }
  }
}

init();
</script>
</body>
